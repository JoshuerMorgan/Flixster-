plugins {
    alias(libs.plugins.android.application)
}

// Read the TMDB key from local.properties (git-ignored) so it stays out of version control.
// Read through providers so the configuration cache is invalidated when the file changes.
def localProps = new Properties()
def localPropsText = providers.fileContents(rootProject.layout.projectDirectory.file("local.properties"))
        .asText.getOrElse("")
localProps.load(new StringReader(localPropsText))

android {
    namespace 'com.example.flixsterplus'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.flixsterplus"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TMDB_API_KEY", "\"${localProps.getProperty('TMDB_API_KEY', '')}\""
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    implementation libs.okhttp
    implementation libs.gson
    implementation libs.glide
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
}
